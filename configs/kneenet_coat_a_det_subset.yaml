# MORT (27/09) : lr backbone 1e-4 uniforme detruit CoAtNet au degel.
# ep1 gel 0.693 / gold 0.659 -> ep3 0.652 / 0.638, proba std 0.21 -> 0.11
# (v20b det ep3 = 0.805). Meme attracteur que ViT lr >= 1e-4 uniforme.
# Arrete a ep3. Successeur : kneenet_coat_a_llrd_det_subset.yaml (LLRD).
#
# CoAt-a baseline : CoAtNet-0 224 (timm coatnet_0_rw_224.sw_in1k, 27M,
# ~ResNet-50) dans le graphe ViT-e / v20b : 6 slots, CAM 7x7 + BiLSTM
# + attention coupe par cible. Stem 2.5D R=k-1 / G=k / B=k+1 (voisins
# linspace crop130), stem_mix init G (epoch 0 = coupe grise).
# Recette v20b (lr 1e-4 / 3e-4, wd 0.05, batch 4) + freeze 1 / re-warmup 1
# (recette ViT, pour les stages Transformer) + no_decay (LN / biais).
# 12 epochs dont 1 gelee ~ budget backbone des 10 epochs v20b.
# Meme split / seed que v20b det (924 / val 653, gold hors split).
# Juger vs subset_v20b_crop130_det_frac025 (val 0.8364 / gold 0.8842) :
# Δ > 0.01 val ET gold. Sinon lire par cible (specialiste d'ensemble).
#   python -X utf8 -m src.train.train --config configs/kneenet_coat_a_det_subset.yaml

run_name: subset_coat_a_crop130_det_frac025
model: kneenet_coat_a
n_series: 6
backbone: coatnet_0_rw_224.sw_in1k
pretrained: true
backbone_weights: weights/coatnet_0_rw_224-sw_in1k
lstm_hidden: 256

no_decay: true

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 0.25
train_frac_seed: 42
seed: 42

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 12
early_stop_patience: 4
skip_gold: false
freeze_encoder_epochs: 1
unfreeze_rewarm_frac: 1.0

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
