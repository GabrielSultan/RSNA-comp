# Full CNX-r7 : ConvNeXt-Small IN-22k, tete R7. RSNA seulement.
# Meme tete que subset_cnx_r7_in22k_v3b_hybrid025 (lr 1e-4 / 1e-3,
# wd 0.05, dropout 0.1, pas de LLRD). Pas les 7 epochs / cosine 7 du subset,
# ni les 16 epochs du run R7 d'origine.
# Labels : data/labels/coolin/targets_v3b_oofmask.csv
#   4348 RSNA, 0 OAI, 31 cellules masquees. Gold non injectes dans le CSV.
# Gold (58, train.csv) ajoutes au train, poids x4.
# series_csv = data/csv/train_series.csv (series RSNA, 0 OAI).
# Pas de val : best.pt ne bouge pas. Snapshots epoch 5 a 12.
# Cosine sur 20 pour que l'epoch 12 ne finisse pas a lr ~ 0.
# crop130 a 224. Pas le cache px384.
# 3070 8 Go, mesure sur cette carte : batch 2, encode_chunk 16, 3 workers.
# VRAM max 2.8 Go, 2.6 s/step. Le chunk 4 laissait le GPU vers 40 % (~12 s/step).
# Chunk 32 : 2.2 s et 4.3 Go, gain trop faible. 288 est le reglage PRO 6000.
# ~1 h 40 / epoch, ~20 h pour 12 epochs.
#
#   python -X utf8 -m src.train.train --config configs/kneenet_cnx_r7_in22k_v3b_oofmask_full.yaml

run_name: cnx_r7_in22k_v3b_oofmask_full
model: kneenet_cnx_r7
n_series: 6
backbone: convnext_small.fb_in22k_ft_in1k
pretrained: true
backbone_weights: weights/convnext_small-fb_in22k_ft_in1k
hidden: 384

labels_csv: data/labels/coolin/targets_v3b_oofmask.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 1.0
val_frac: 0
include_gold: true
gold_sample_weight: 4.0
seed: 42

batch_size: 2
encode_chunk: 16
log_every: 100
num_workers: 3
epochs: 12
cosine_epochs: 20
save_epochs: [5, 6, 7, 8, 9, 10, 11, 12]
early_stop_patience: 0
skip_gold: false
freeze_encoder_epochs: 0
unfreeze_rewarm_frac: 1.0

lr_backbone: 0.0001
lr_head: 0.001
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
dropout: 0.1
