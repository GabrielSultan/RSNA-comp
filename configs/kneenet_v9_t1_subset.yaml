# Ablation naive v9 (T1 toujours dans le softmax, encodeur partage). RUN TERMINE.
# Ne pas relancer : kneenet_v9.py a maintenant une gate + no_grad T1.
# Nouveau run : configs/kneenet_v9_t1_gate_subset.yaml
#   python -X utf8 -m src.train.train --config configs/kneenet_v9_t1_subset.yaml

run_name: subset_v9_t1_frac025
model: kneenet_v9
n_series: 4
backbone: convnext_tiny
pretrained: true

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/volumes.zip

train_frac: 0.25
train_frac_seed: 42

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 10
early_stop_patience: 3
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
