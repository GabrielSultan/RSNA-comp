# v20b320 = v20b (6 slots FS/T1, CAM dilated, BiLSTM) sur NPZ 320x320.
# Grille CAM 20x20 (stride 16) au lieu de 14x14 a 224.
# batch 2 + encode_chunk 4 : ~meme VRAM que v20b batch 4 a 224.
# Juger vs subset_v20b_crop130_det_frac025 (val ET gold, Δ > 0.01).
#   python -X utf8 -m src.train.train --config configs/kneenet_v20b320_crop130_320_subset.yaml

run_name: subset_v20b320_crop130_320_frac025
model: kneenet_v20b320
n_series: 6
backbone: resnet50
pretrained: true
backbone_weights: weights/ResNet50.pt
lstm_hidden: 256

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130_320
img_size: 320

train_frac: 0.25
train_frac_seed: 42
seed: 42

batch_size: 2
encode_chunk: 4
num_workers: 3
epochs: 10
early_stop_patience: 3
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
