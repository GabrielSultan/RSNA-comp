# v17 full train : CAM 14x14 dilated + BiLSTM (residu init 0, hidden 256).
# Recette subset : val 0.838 / gold 0.875 @ ep10, 25 % du train.
# Meme hyperparams que le subset, 20 epochs comme v11 full.
#   python -X utf8 -m src.train.train --config configs/kneenet_v17_crop130.yaml

run_name: v17_crop130v1
model: kneenet_v17
n_series: 3
backbone: resnet50
pretrained: true
backbone_weights: weights/ResNet50.pt
lstm_hidden: 256

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 1.0

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 20
early_stop_patience: 3
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
