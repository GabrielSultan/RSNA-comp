# Full train CoAt-a LLRD 0.8, entree 224.
# Meme squelette que subset_coat_a_llrd08_det_frac025
# (arrete ep6 : val 0.7913 / gold 0.7894) : CoAtNet-0, LLRD 0.8,
# no_decay, freeze 1 / re-warmup 1, batch 4, encode_chunk 8.
# Remplace kneenet_coat_a_crop130_oofmask_full.yaml (labels gpt56sol).
#
# Labels : data/labels/coolin/targets_v3b_oofmask.csv
#   OOF v20h DINO ep11. Gold non injectes dans le CSV.
# Gold (58, train.csv) ajoutes au train, poids x4. Pas de val.
# Pas de laterality. Cosine sur 20 epochs, stop a 12.
# Snapshots epoch 6 a 12 (pas de best.pt : val_frac 0).
# ~2 h / epoch sur la 3070, ~27 h pour 12 epochs.
#
#   python -X utf8 -m src.train.train --config configs/kneenet_coat_a_llrd08_v3b_oofmask_full.yaml

run_name: coat_a_llrd08_v3b_oofmask_full
model: kneenet_coat_a
n_series: 6
backbone: coatnet_0_rw_224.sw_in1k
pretrained: true
backbone_weights: weights/coatnet_0_rw_224-sw_in1k
lstm_hidden: 256

llrd: 0.8
no_decay: true

labels_csv: data/labels/coolin/targets_v3b_oofmask.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 1.0
val_frac: 0
include_gold: true
gold_sample_weight: 4.0
seed: 42

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 12
cosine_epochs: 20
save_epochs: [6, 7, 8, 9, 10, 11, 12]
early_stop_patience: 0
skip_gold: false
freeze_encoder_epochs: 1
unfreeze_rewarm_frac: 1.0

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
