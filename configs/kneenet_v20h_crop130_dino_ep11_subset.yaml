# v20h subset, meme recette que kneenet_v20h_crop130_det_subset.yaml.
# Seule difference : encodeur DINO crop130, epoch 11.
# Juger vs subset_v20h_crop130_det_frac025 (val ET gold, delta > 0.01).
#   python -X utf8 -m src.train.train --config configs/kneenet_v20h_crop130_dino_ep11_subset.yaml

run_name: subset_v20h_crop130_dino_ep11_frac025
model: kneenet_v20h
n_series: 6
backbone: resnet50
pretrained: true
backbone_weights: checkpoints/v20h_ssl_dino_screen/encoder_ep11.pt
lstm_hidden: 256

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 0.25
train_frac_seed: 42
seed: 42

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 10
early_stop_patience: 3
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
