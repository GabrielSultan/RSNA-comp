# v20h retrain 100 % : labels gpt56sol masque OOF v17 (ACL restauree,
# recette v20b), gold dans le train x4, canon laterality L (flip R,
# tag puis centre 20 mm). Cosine sur 20 epochs, stop a 12.
# Snapshots 7-12 (pas de val : best.pt ne bouge pas ; sonder
# epoch{7-12}.pt + last.pt). Distinct du run coolin-blend
# v20h_crop130_oofmask_lat_full.
#
# Labels deja prets (ne pas re-masquer / --restore-acl) :
#   data/labels/labels_llm_gpt56sol_oofmask_v20b.csv
# Laterality (obligatoire) :
#   data/csv/study_laterality.csv
# Train :
#   python -X utf8 -m src.train.train --config configs/kneenet_v20h_crop130_oofmask_v20b_lat_full.yaml

run_name: v20h_crop130_oofmask_v20b_lat_full
model: kneenet_v20h
n_series: 6
backbone: resnet50
pretrained: true
backbone_weights: weights/ResNet50.pt
lstm_hidden: 256

labels_csv: data/labels/labels_llm_gpt56sol_oofmask_v20b.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 1.0
val_frac: 0
include_gold: true
gold_sample_weight: 4.0

laterality: true
laterality_csv: data/csv/study_laterality.csv

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 12
cosine_epochs: 20
save_epochs: [7, 8, 9, 10, 11, 12]
early_stop_patience: 0
skip_gold: false
seed: 42

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
