# KneeNet-ViT-b subset : CLS pour les coupes + bias prior + pas de gel.
# Meme 25 % seed 42 / gpt56sol / crop130 6 slots que v20b et vit v1.
# Ne pas relancer configs/kneenet_vit_crop130_subset.yaml (v1, freeze+3e-5).
# Juger vs subset_v20b_crop130_frac025 ET subset_vit_dinov3_crop130_frac025
# (val ET gold, Δ > 0.01). Epoch 4 : train < 0.45, val > 0.78, std > 0.22.
#   python -X utf8 -m src.train.train --config configs/kneenet_vit_b_crop130_subset.yaml

run_name: subset_vit_dinov3_b_crop130_frac025
model: kneenet_vit_b
n_series: 6
backbone: vit_base_patch16_dinov3.lvd1689m
pretrained: true
backbone_weights: weights/dinov3-vitb16-lvd1689m
lstm_hidden: 256

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 0.25
train_frac_seed: 42

batch_size: 2
encode_chunk: 4
num_workers: 2
epochs: 10
cosine_epochs: 20
early_stop_patience: 3
skip_gold: false
freeze_encoder_epochs: 0

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.2
