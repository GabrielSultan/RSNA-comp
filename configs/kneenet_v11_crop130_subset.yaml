# v11 = v10 + diffs k-1/k/k+1 (B) + Conv2d 1x1 init « tout depuis G » (A).
# Epoch 0 = v10 (R=G=B=k). Ne pas --resume un ckpt triplet brut (stem_mix absent).
# Meme recette subset que v10 : crop 130 mm, train_frac 0.25, seed 42.
#   python -X utf8 -m src.train.train --config configs/kneenet_v11_crop130_subset.yaml

run_name: subset_v11_crop130_frac025
model: kneenet_v11
n_series: 3
backbone: resnet50
pretrained: true
backbone_weights: weights/ResNet50.pt

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 0.25
train_frac_seed: 42

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 10
early_stop_patience: 3
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
