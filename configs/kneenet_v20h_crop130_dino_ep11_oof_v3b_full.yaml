# Full train du squelette v20h DINO ep11 / targets_v3b, apres masque OOF.
# Pas de laterality (le run OOF n'en avait pas).
# Labels : data/labels/coolin/targets_v3b_oofmask.csv
#   (contradiction franche seulement ; gold non injectes dans le CSV).
# Gold (58, train.csv) ajoutes au train, poids x4.
# Pas de val : best.pt ne bouge pas. Snapshots epoch 5 a 12.
# Cosine sur 20 epochs pour que l'epoch 12 ne finisse pas a lr ~ 0.
#
#   python -X utf8 -m src.train.train --config configs/kneenet_v20h_crop130_dino_ep11_oof_v3b_full.yaml

run_name: v20h_crop130_dino_ep11_oof_v3b_full
model: kneenet_v20h
n_series: 6
backbone: resnet50
pretrained: true
backbone_weights: checkpoints/v20h_ssl_dino_screen/encoder_ep11.pt
lstm_hidden: 256

labels_csv: data/labels/coolin/targets_v3b_oofmask.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 1.0
val_frac: 0
include_gold: true
gold_sample_weight: 4.0
seed: 42

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 12
cosine_epochs: 20
save_epochs: [5, 6, 7, 8, 9, 10, 11, 12]
early_stop_patience: 0
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
