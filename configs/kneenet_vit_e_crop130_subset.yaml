# KneeNet-ViT-e subset : graphe v1 (CAM+LSTM) + stem RGB de d.
# D ep6 : val 0.771 / gold 0.744 / contusion 0.72 — mieux que C, sous v1
# (0.783 / 0.797 / 0.81). CLS+v8 plafonne. E recolle CAM sur le 2.5D.
# Recette v1 : freeze 1, lr 3e-5, + LayerScale gele + re-warmup 1 epoch.
# Juger vs v1 ET d (val, gold, contusion, Δ > 0.01).
#   python -X utf8 -m src.train.train --config configs/kneenet_vit_e_crop130_subset.yaml

run_name: subset_vit_dinov3_e_crop130_frac025
model: kneenet_vit_e
n_series: 6
backbone: vit_base_patch16_dinov3.lvd1689m
pretrained: true
backbone_weights: weights/dinov3-vitb16-lvd1689m
lstm_hidden: 256

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 0.25
train_frac_seed: 42

batch_size: 2
encode_chunk: 4
num_workers: 2
epochs: 10
early_stop_patience: 3
skip_gold: false
freeze_encoder_epochs: 1
unfreeze_rewarm_frac: 1.0

lr_backbone: 0.00003
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
