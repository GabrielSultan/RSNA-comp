# ViT-k 320 LLRD 0.8, from scratch (pas de SWA), subset hybride v3b.
# Meme CSV que les trois autres : 1265 RSNA + 422 OAI, val = 652 RSNA.
# Pas de gel (comme le full 320). 7 epochs, pas de snapshot epochN.pt.
# LR 1e-4 / 3e-4, cosine sur 7.
# Pod : batch 2, encode_chunk 288, grad_checkpoint false.
#
#   python -X utf8 -m src.train.train --config configs/hybrid025/kneenet_vit_k_llrd08_320_v3b_hybrid025.yaml

run_name: subset_vit_k_llrd08_320_v3b_hybrid025
model: kneenet_vit_k320
n_series: 6
backbone: vit_base_patch16_dinov3.lvd1689m
pretrained: true
backbone_weights: weights/dinov3-vitb16-lvd1689m
lstm_hidden: 256
img_size: 320

llrd: 0.8
no_decay: true

labels_csv: data/labels/coolin/targets_v3b_hybrid025.csv
series_csv: data/oai/derived/train_series_oai.csv
zip_path: data/crop130_320

train_frac: 1.0
val_frac: 0.15
include_gold: false
seed: 42

batch_size: 2
encode_chunk: 288
grad_checkpoint: false
log_every: 100
num_workers: 8
epochs: 7
cosine_epochs: 7
save_epochs: []
early_stop_patience: 0
skip_gold: false
freeze_encoder_epochs: 0
unfreeze_rewarm_frac: 1.0

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
