# v20h DINO ep11, subset hybride v3b. Meme split que
# kneenet_v20h_crop130_dino_ep11_v3b_hybrid025.yaml (notebook 08) :
#   1265 RSNA + 422 OAI en train, val = 652 RSNA, gold hors split.
# Seuls ecarts vs ce run (val 0.9551 @ ep7, wd 0.05, dropout 0.4, cosine 7) :
#   weight_decay 0.01, dropout 0.2, 8 epochs, cosine sur 10
#   (a l'epoch 8 le lr backbone vaut encore ~1e-5, pas 0).
# LR inchanges : 1e-4 / 3e-4. Juger l'AUC val contre 0.9551, delta > 0.01.
# 3070 8 Go : encode_chunk 8, 2 workers.
#
#   python -X utf8 -m src.train.train --config configs/hybrid025/kneenet_v20h_crop130_dino_ep11_v3b_hybrid025_wd01.yaml

run_name: subset_v20h_dino_ep11_v3b_hybrid025_wd01
model: kneenet_v20h
n_series: 6
backbone: resnet50
pretrained: true
backbone_weights: checkpoints/v20h_ssl_dino_screen/encoder_ep11.pt
lstm_hidden: 256

labels_csv: data/labels/coolin/targets_v3b_hybrid025.csv
series_csv: data/oai/derived/train_series_oai.csv
zip_path: data/crop130

train_frac: 1.0
val_frac: 0.15
include_gold: false
seed: 42

batch_size: 4
encode_chunk: 8
log_every: 100
num_workers: 2
epochs: 8
cosine_epochs: 10
save_epochs: []
early_stop_patience: 0
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.01
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.2
