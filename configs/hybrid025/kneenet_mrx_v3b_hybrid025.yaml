# MRX : transformer profondeur x espace, subset hybride v3b.
# Meme split que v20h hybrid025 (1265 RSNA + 422 OAI, val 652 RSNA).
# Le test est le melangeur, pas un autre encodeur : meme DINO ep11.
# Epoch 1 encodeur gele (tete seule), puis degel avec re-warmup.
# Residu max-pool MRNet init 0.
# 3070 8 Go : batch 2, encode_chunk 4. La grille 7x7 tient ;
# le cout lourd reste le ResNet, comme v20h.
# Arret : macro val < v20h du meme split - 0.01 a l'epoch 7.
#
#   python -X utf8 -m src.train.train --config configs/hybrid025/kneenet_mrx_v3b_hybrid025.yaml

run_name: subset_mrx_v3b_hybrid025
model: kneenet_mrx
n_series: 6
backbone: resnet50
pretrained: true
backbone_weights: checkpoints/v20h_ssl_dino_screen/encoder_ep11.pt
d_model: 128
grid: 7
nhead: 4
n_depth_layers: 1
n_space_layers: 1
attn_dropout: 0.1

labels_csv: data/labels/coolin/targets_v3b_hybrid025.csv
series_csv: data/oai/derived/train_series_oai.csv
zip_path: data/crop130

train_frac: 1.0
val_frac: 0.15
include_gold: false
seed: 42

batch_size: 2
encode_chunk: 4
log_every: 100
num_workers: 2
epochs: 7
cosine_epochs: 7
save_epochs: []
early_stop_patience: 0
skip_gold: false
freeze_encoder_epochs: 1

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 256
dropout: 0.2
