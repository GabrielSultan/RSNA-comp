# CoAt-a LLRD 0.8, from scratch (pas de SWA), subset hybride v3b.
# Meme CSV : 1265 RSNA + 422 OAI en train, val = 652 RSNA, zero OAI en val.
# Gel d'encodeur 1 epoch puis re-warmup, comme le full from scratch.
# 7 epochs, pas de snapshot epochN.pt. LR 1e-4 / 3e-4, cosine sur 7.
# 3070 8 Go : encode_chunk 8, 3 workers (le pod avait 576 / 8).
#
#   python -X utf8 -m src.train.train --config configs/hybrid025/kneenet_coat_a_llrd08_v3b_hybrid025.yaml

run_name: subset_coat_a_llrd08_v3b_hybrid025
model: kneenet_coat_a
n_series: 6
backbone: coatnet_0_rw_224.sw_in1k
pretrained: true
backbone_weights: weights/coatnet_0_rw_224-sw_in1k
lstm_hidden: 256

llrd: 0.8
no_decay: true

labels_csv: data/labels/coolin/targets_v3b_hybrid025.csv
series_csv: data/oai/derived/train_series_oai.csv
zip_path: data/crop130

train_frac: 1.0
val_frac: 0.15
include_gold: false
seed: 42

batch_size: 4
encode_chunk: 8
log_every: 100
num_workers: 3
epochs: 7
cosine_epochs: 7
save_epochs: []
early_stop_patience: 0
skip_gold: false
freeze_encoder_epochs: 1
unfreeze_rewarm_frac: 1.0

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
