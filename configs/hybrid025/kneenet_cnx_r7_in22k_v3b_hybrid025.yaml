# CNX-r7 : ConvNeXt-Small IN-22k, tete R7 (attention spatiale, attention
# par coupe, etendue OA, syn_beta). Entree = subset hybrid025, labels v3b,
# crop130 a 224. Pas le cache px384_v4 (rendu 384 / vues 100 mm).
# 16 epochs et llrd 1 du run R7 ne sont pas repris : 7 epochs, cosine 7,
# comme les autres subset hybrid025. lr encodeur 1e-4, tete 1e-3, wd 0.05,
# dropout 0.1 : les reglages de la tete R7.
# 3070 8 Go : batch 2, encode_chunk 4 (Small, stage 2 a 27 blocs).
#
#   python -X utf8 -m src.train.train --config configs/hybrid025/kneenet_cnx_r7_in22k_v3b_hybrid025.yaml

run_name: subset_cnx_r7_in22k_v3b_hybrid025
model: kneenet_cnx_r7
n_series: 6
backbone: convnext_small.fb_in22k_ft_in1k
pretrained: true
backbone_weights: weights/convnext_small-fb_in22k_ft_in1k
hidden: 384

labels_csv: data/labels/coolin/targets_v3b_hybrid025.csv
series_csv: data/oai/derived/train_series_oai.csv
zip_path: data/crop130

train_frac: 1.0
val_frac: 0.15
include_gold: false
seed: 42

batch_size: 2
encode_chunk: 4
log_every: 100
num_workers: 3
epochs: 7
cosine_epochs: 7
save_epochs: []
early_stop_patience: 0
skip_gold: false
freeze_encoder_epochs: 0
unfreeze_rewarm_frac: 1.0

lr_backbone: 0.0001
lr_head: 0.001
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
dropout: 0.1
