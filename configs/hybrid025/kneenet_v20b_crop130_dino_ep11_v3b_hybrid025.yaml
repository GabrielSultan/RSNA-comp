# v20b DINO ep11, from scratch (pas de SWA), subset hybride v3b.
# Train fige : data/labels/coolin/targets_v3b_hybrid025.csv
#   1687 etudes = 25 % de (4348 RSNA + 2399 OAI), dont 1265 RSNA (3/4)
#   et 422 OAI (1/4). Meme fichier pour les 4 runs. Seed 42.
# Val : les 652 etudes RSNA de targets_v3b_det_frac025.csv. Aucune OAI.
# Gold hors train/val, sanity gold_macro_auc dans history.json.
# 7 epochs, pas de snapshot epochN.pt (last.pt / best.pt seulement, reprise).
# LR from scratch 1e-4 / 3e-4. Cosine sur les 7 epochs.
# 3070 8 Go : encode_chunk 8, 2 workers (le pod avait 576 / 8).
#
#   python -X utf8 -m src.train.train --config configs/hybrid025/kneenet_v20b_crop130_dino_ep11_v3b_hybrid025.yaml

run_name: subset_v20b_dino_ep11_v3b_hybrid025
model: kneenet_v20b
n_series: 6
backbone: resnet50
pretrained: true
backbone_weights: checkpoints/v20h_ssl_dino_screen/encoder_ep11.pt
lstm_hidden: 256

labels_csv: data/labels/coolin/targets_v3b_hybrid025.csv
series_csv: data/oai/derived/train_series_oai.csv
zip_path: data/crop130

train_frac: 1.0
val_frac: 0.15
include_gold: false
seed: 42

batch_size: 4
encode_chunk: 8
log_every: 100
num_workers: 2
epochs: 7
cosine_epochs: 7
save_epochs: []
early_stop_patience: 0
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
