# MV-LQM Mamba (copie Original_main), subset hybride v3b.
# Train fige : data/labels/coolin/targets_v3b_hybrid025.csv
#   1687 etudes = 25 % de (4348 RSNA + 2399 OAI), dont 1265 RSNA (3/4)
#   et 422 OAI (1/4). Meme fichier que les autres runs hybrid025. Seed 42.
# Val : les 652 etudes RSNA de targets_v3b_det_frac025.csv. Aucune OAI.
# Gold hors train/val, sanity gold_macro_auc dans history.json.
# 7 epochs, pas de snapshot epochN.pt (last.pt / best.pt seulement).
# 3 plans fluides (pas les 6 slots). FOV 120 mm dans le forward
# (crop 207 px offset 8 sur le zip crop130 224, resize 224).
# Pas de D0 (flips LPS) : la table n'est pas dans le zip.
# LR subset : 1e-4 / 3e-4, comme v20b hybrid025. Pas le LRD 1e-6..2e-5
# du run complet CET.
# 3070 8 Go : batch 2, encode_chunk 4, 3 workers.
# chunk 16 a sature la carte au premier forward.
#
#   python -X utf8 -m src.train.train --config configs/hybrid025/kneenet_mvlqm_v3b_hybrid025.yaml

run_name: subset_mvlqm_v3b_hybrid025
model: kneenet_mvlqm
n_series: 3
backbone: resnet50
pretrained: true
backbone_weights: weights/ResNet50.pt

labels_csv: data/labels/coolin/targets_v3b_hybrid025.csv
series_csv: data/oai/derived/train_series_oai.csv
zip_path: data/crop130

train_frac: 1.0
val_frac: 0.15
include_gold: false
seed: 42

batch_size: 2
encode_chunk: 4
log_every: 100
num_workers: 3
epochs: 7
cosine_epochs: 7
save_epochs: []
early_stop_patience: 0
skip_gold: false
freeze_encoder_epochs: 0

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
