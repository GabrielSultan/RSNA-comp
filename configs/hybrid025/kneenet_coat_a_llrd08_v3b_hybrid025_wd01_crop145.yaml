# CoAt-a LLRD 0.8, subset hybride v3b. Meme encodeur que
# subset_coat_a_llrd08_v3b_hybrid025 (coatnet_0, pas le rmlp2 :
# celui-ci restait vers 0.55-0.75). Parent : val 0.9041 / gold 0.8591
# @ ep7, wd 0.05, dropout 0.4, crop130, cosine 7.
# A l'epoch 7 le macro montait encore (+0.002) avec un cosinus deja
# a zero, et les cibles faibles sont MCL 0.770, ACL 0.832, PF OA 0.841.
# Ecarts vs le parent, la recette du v20h crop145 (0.9584) :
#   weight_decay 0.01, dropout 0.2, 8 epochs, cosine sur 10
#   (a l'epoch 8 le lr backbone vaut encore ~1e-5)
#   FOV 145 mm puis 130 mm (T1 RSNA + OAI). Premiere source gagne.
# Inchanges : LLRD 0.8, gel 1 epoch, re-warmup, LR 1e-4 / 3e-4,
# split 1265 RSNA + 422 OAI, val 652 RSNA, gold hors split.
# Juger l'AUC val contre 0.9041, delta > 0.01. Regarder MCL, ACL, PF.
# 3070 8 Go : encode_chunk 8, 3 workers.
#
#   python -X utf8 -m src.train.train --config configs/hybrid025/kneenet_coat_a_llrd08_v3b_hybrid025_wd01_crop145.yaml

run_name: subset_coat_a_llrd08_v3b_hybrid025_wd01_crop145
model: kneenet_coat_a
n_series: 6
backbone: coatnet_0_rw_224.sw_in1k
pretrained: true
backbone_weights: weights/coatnet_0_rw_224-sw_in1k
lstm_hidden: 256

llrd: 0.8
no_decay: true

labels_csv: data/labels/coolin/targets_v3b_hybrid025.csv
series_csv: data/oai/derived/train_series_oai.csv
zip_path:
  - data/crop145
  - data/crop130

train_frac: 1.0
val_frac: 0.15
include_gold: false
seed: 42

batch_size: 4
encode_chunk: 8
log_every: 100
num_workers: 3
epochs: 8
cosine_epochs: 10
save_epochs: []
early_stop_patience: 0
skip_gold: false
freeze_encoder_epochs: 1
unfreeze_rewarm_frac: 1.0

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.01
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.2
