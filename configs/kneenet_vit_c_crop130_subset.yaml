# KneeNet-ViT-c subset : CLS + attention v8 (pas de CAM, pas de LSTM).
# Isole le graphe vs v1 (CAM+GAP+LSTM, val 0.802). Meme donnees / seed.
# Gel 2 epochs (le pretrain DINOv3 est la feature), puis lr_backbone 3e-5.
# Ne pas relancer vit / vit_b (graphe v20b, FIGES).
# Juger vs subset_vit_dinov3_crop130_frac025 ET subset_v20b_crop130_frac025
# (val ET gold, Δ > 0.01). Epoch 4 : train < 0.45, val > 0.78, std > 0.22.
#   python -X utf8 -m src.train.train --config configs/kneenet_vit_c_crop130_subset.yaml

run_name: subset_vit_dinov3_c_crop130_frac025
model: kneenet_vit_c
n_series: 6
backbone: vit_base_patch16_dinov3.lvd1689m
pretrained: true
backbone_weights: weights/dinov3-vitb16-lvd1689m

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 0.25
train_frac_seed: 42

batch_size: 2
encode_chunk: 4
num_workers: 2
epochs: 10
early_stop_patience: 3
skip_gold: false
freeze_encoder_epochs: 2

lr_backbone: 0.00003
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
