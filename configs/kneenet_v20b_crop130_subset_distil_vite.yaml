# v20b subset + distillation ViT-e (soft) sur le trou v20b.
# Teacher = subset_vit_dinov3_e (memes 924 UID, seed 42) — pas le full oofmask
# (fuite : le full a vu le reste du train).
# Loss = BCE(LLM masquee) + λ T² BCE(z_s/T, σ(z_t/T)), T=1, λ=0.3.
# Cibles KD : MCL, Medial Meniscus, Effusion (Δ gold ViT-e vs v17).
# Juger vs subset_v20b_crop130_frac025 (val ET gold, Δ > 0.01), surtout
# les 3 cibles KD. λ=0.5 : configs/kneenet_v20b_crop130_subset_distil_vite_lam05.yaml
#
#   python -X utf8 -m src.train.dump_teacher_preds --config configs/kneenet_vit_e_crop130_subset.yaml --splits train --out data/labels/teacher_vite_subset_e.csv
#   python -X utf8 -m src.train.train --config configs/kneenet_v20b_crop130_subset_distil_vite.yaml

run_name: subset_v20b_distil_vite_lam03_frac025
model: kneenet_v20b
n_series: 6
backbone: resnet50
pretrained: true
backbone_weights: weights/ResNet50.pt
lstm_hidden: 256

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 0.25
train_frac_seed: 42

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 10
early_stop_patience: 3
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4

distil_csv: data/labels/teacher_vite_subset_e.csv
distil_targets: ["MCL", "Medial Meniscus", "Effusion"]
distil_lambda: 0.3
distil_temp: 1.0
