# CoAt-b = CoAt-a LLRD 0.8 + un seul levier : llrd 0.9 (meme pic 1e-4).
# Modele, data, split, schedule (12 ep, freeze 1, re-warmup 1) identiques.
# Pourquoi : a 0.8 le bas de l'encodeur est quasi gele (stem 4.4e-6,
# bloc1 5.5e-6) et CoAt-a sous-apprend vs v20b (train loss ep6 0.400 vs
# 0.370, val 0.425 : pas d'overfit). Deficit large (ACL, MCL, menisque
# medial, Baker's, fracture) = adaptation des features, pas resolution
# (v14bis 7x7 lit deja MM 0.906 / Baker 0.892). 0.9 -> stem 2.3e-5,
# bloc1 2.5e-5, MBConv 2.5e-5 -> 3.9e-5, stage 2 4.3e-5 -> 8.1e-5,
# stage 3 ~1e-4. Borne haute connue : 1e-4 uniforme = mort au degel.
# Juger vs subset_coat_a_llrd08_det_frac025 a epoch egale (arrete ep6 :
# 0.7913 / 0.7894), Δ > 0.01 val ET gold, puis vs
# subset_v20b_crop130_det_frac025 (0.8364 / 0.8842).
# Arret anticipe : val ep3 < val ep1 avec proba std < 0.12 = meme
# signature que le lr uniforme.
# Un seul train a la fois sur la 3070 :
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_coat_b_llrd09_det_subset.yaml

run_name: subset_coat_b_llrd09_det_frac025
model: kneenet_coat_a
n_series: 6
backbone: coatnet_0_rw_224.sw_in1k
pretrained: true
backbone_weights: weights/coatnet_0_rw_224-sw_in1k
lstm_hidden: 256

llrd: 0.9
no_decay: true

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 0.25
train_frac_seed: 42
seed: 42

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 12
early_stop_patience: 4
skip_gold: false
freeze_encoder_epochs: 1
unfreeze_rewarm_frac: 1.0

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
