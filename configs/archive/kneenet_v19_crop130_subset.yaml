# v19 = v17 + pack_padded LSTM (series droppees / manquantes ignorees).
# Pas de T1. Meme recette subset : crop 130 mm, gpt56sol, frac 0.25, seed 42.
# Juger vs subset_v17_crop130_frac025 (val ET gold, Δ > 0.01).
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_v19_crop130_subset.yaml

run_name: subset_v19_crop130_frac025
model: kneenet_v19
n_series: 3
backbone: resnet50
pretrained: true
backbone_weights: weights/ResNet50.pt
lstm_hidden: 256

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 0.25
train_frac_seed: 42

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 10
early_stop_patience: 3
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
