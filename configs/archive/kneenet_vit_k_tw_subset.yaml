# Un levier : target_weight inv_sqrt sur recette k (LLRD 0.8 + no_decay).
# Pas de pos_weight (deja mort). La val_loss reste une BCE uniforme pour
# rester comparable a k. Juger vs subset_vit_k_llrd08_frac025 :
#   val + gold coherents, Delta > 0.01 ; surtout Fracture / Syn / MCL / LatMen.
# Bruit si Delta < 0.01. Ne pas empiler avec gold_sample_weight ni smoothing.
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_vit_k_tw_subset.yaml

run_name: subset_vit_k_tw_invsqrt_frac025
model: kneenet_vit_e
n_series: 6
backbone: vit_base_patch16_dinov3.lvd1689m
pretrained: true
backbone_weights: weights/dinov3-vitb16-lvd1689m
lstm_hidden: 256

llrd: 0.8
no_decay: true

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130_rgb25d
rgb_neighbors: true
rgb_as_gray: true

train_frac: 0.25
train_frac_seed: 42
seed: 42

batch_size: 2
encode_chunk: 4
num_workers: 2
epochs: 14
early_stop_patience: 5
save_epochs: [7, 8, 9, 10]
skip_gold: false
freeze_encoder_epochs: 1
unfreeze_rewarm_frac: 1.0

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
target_weight: inv_sqrt
head_dim: 512
dropout: 0.4
