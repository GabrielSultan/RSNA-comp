# v20c = v17 + mixage Z residuel sur les cartes 14x14 (w init 0).
# Recette subset identique a v17 : crop 130 mm (v1), gpt56sol, frac 0.25, seed 42.
# Juger vs subset_v17_crop130_frac025 (val ET gold).
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_v20c_crop130_subset.yaml

run_name: subset_v20c_crop130_frac025
model: kneenet_v20c
n_series: 3
backbone: resnet50
pretrained: true
backbone_weights: weights/ResNet50.pt
lstm_hidden: 256

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 0.25
train_frac_seed: 42

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 10
early_stop_patience: 3
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
