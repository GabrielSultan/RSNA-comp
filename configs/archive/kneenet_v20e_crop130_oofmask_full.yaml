# v20e retrain 100 % : meme recette que v20b_crop130_oofmask_full
# (masque OOF v17, ACL gpt56sol, gold x4, cosine 20 / stop 12)
# + pooling profondeur par finding (voir kneenet_v20e_crop130_subset.yaml).
# Lancer le subset d'abord ; ce YAML est pret si le Δ val tient.
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_v20e_crop130_oofmask_full.yaml

run_name: v20e_crop130_oofmask_full
model: kneenet_v20e
n_series: 6
backbone: resnet50
pretrained: true
backbone_weights: weights/ResNet50.pt
lstm_hidden: 256
slice_pool_k: [2, 2, 1, 1, 0, 0, 0, 0, 0, 1, 1, 1]
slice_pool_mix: 0.85

labels_csv: data/labels/labels_llm_gpt56sol_oofmask_v20b.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 1.0
val_frac: 0
include_gold: true
gold_sample_weight: 4.0

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 12
cosine_epochs: 20
save_epochs: [7, 8, 9, 10, 11, 12]
early_stop_patience: 0
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
