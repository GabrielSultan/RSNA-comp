# v18 = v17 (CAM 14x14 + BiLSTM) + 4e slot T1 / non-fluide + gate.
# g = sigmoid(-2.2) ≈ 0.10 au depart : le softmax n'ouvre le T1 que s'il aide.
# Pas les hacks v9 (attn_temp / head_init_std) : stack v17 inchange.
# Crop 130 mm 224 + zips T1 (volumes_crop130_t1_part*.zip), gpt56sol, frac 0.25.
# Temoin sans T1 : checkpoints/subset_v18_crop130_frac025 (ne pas ecraser).
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_v18_crop130_subset.yaml

run_name: subset_v18_crop130_t1_frac025
model: kneenet_v18
n_series: 4
backbone: resnet50
pretrained: true
backbone_weights: weights/ResNet50.pt
lstm_hidden: 256
t1_gate_init: -2.2
t1_drop_p: 0.0

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 0.25
train_frac_seed: 42

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 10
early_stop_patience: 3
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
