# Reprise Kaggle T4 du full ViT-k, depuis epoch9.pt (AdamW inclus).
# Meme recette que kneenet_vit_k_llrd08_v3b_oofmask_full.yaml.
# Seuls encode_chunk et num_workers changent : la carte a 16 Go et 4 coeurs.
# Le decoupage encodeur ne change pas les gradients (LayerNorm, pas de BatchNorm).
# batch 2, cosine sur 20 epochs, stop a 12, gold x4, seed 42.

run_name: vit_k_llrd08_v3b_oofmask_full
model: kneenet_vit_e
n_series: 6
backbone: vit_base_patch16_dinov3.lvd1689m
pretrained: true
backbone_weights: weights/dinov3-vitb16-lvd1689m
lstm_hidden: 256

llrd: 0.8
no_decay: true

labels_csv: data/labels/coolin/targets_v3b_oofmask_vitk.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130_rgb25d
rgb_neighbors: true
rgb_as_gray: true

train_frac: 1.0
val_frac: 0
include_gold: true
gold_sample_weight: 4.0

batch_size: 2
encode_chunk: 4
num_workers: 2
epochs: 12
cosine_epochs: 20
save_epochs: [5, 6, 7, 8, 9, 10, 11, 12]
early_stop_patience: 0
skip_gold: false
freeze_encoder_epochs: 1
unfreeze_rewarm_frac: 1.0
seed: 42

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
