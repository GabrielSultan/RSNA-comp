# Reprise LOCALE du full ViT-k 320, a partir de last.pt epoch 8
# (checkpoints/vit_k_llrd08_320_v3b_oofmask_vitk_full_oai3).
# Meme run_name : l'history continue. Plus d'etudes OAI (images 320 OAI
# absentes en local) : RSNA filtre vitk + gold x4. RTX 3070 8 Go :
# encode_chunk 4 + grad_checkpoint true (meme graphe que le chunk 288 du
# pod, decoupe pour la VRAM). cosine_epochs 31 * 2203 steps ~= le cosinus
# d'origine 20 * 3402, pour ne pas sauter de LR au step 27216.
# Stop a l'epoch 11 (cap deja decide).
#
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_vit_k_llrd08_320_v3b_oofmask_vitk_full_rsna_local.yaml --resume

run_name: vit_k_llrd08_320_v3b_oofmask_vitk_full_oai3
model: kneenet_vit_k320
n_series: 6
backbone: vit_base_patch16_dinov3.lvd1689m
pretrained: true
backbone_weights: weights/dinov3-vitb16-lvd1689m
lstm_hidden: 256
img_size: 320

llrd: 0.8
no_decay: true

labels_csv: data/labels/coolin/targets_v3b_oofmask_vitk.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130_320

train_frac: 1.0
val_frac: 0
include_gold: true
gold_sample_weight: 4.0
seed: 42

batch_size: 2
encode_chunk: 4
grad_checkpoint: true
log_every: 50
num_workers: 2
epochs: 11
cosine_epochs: 31
save_epochs: [11]
early_stop_patience: 0
skip_gold: false
freeze_encoder_epochs: 0
unfreeze_rewarm_frac: 1.0

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
