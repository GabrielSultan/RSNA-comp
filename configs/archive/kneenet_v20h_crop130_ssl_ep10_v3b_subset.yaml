# v20h subset, meme recette que kneenet_v20h_crop130_ssl_ep6_v3b_subset.yaml.
# Encodeur SimCLR crop130, epoch 10.
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_v20h_crop130_ssl_ep10_v3b_subset.yaml

run_name: subset_v20h_crop130_ssl_ep10_v3b_frac025
model: kneenet_v20h
n_series: 6
backbone: resnet50
pretrained: true
backbone_weights: checkpoints/v20h_ssl_from_pod/encoder_ep10.pt
lstm_hidden: 256

labels_csv: data/labels/coolin/targets_v3b_det_frac025.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 1.0
train_frac_seed: 42
seed: 42

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 10
early_stop_patience: 3
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
