# v20b retrain 100 % : masque OOF v17, ACL gpt56sol restauree (T1).
# Gold x4, pas de val. Cosine sur 20 epochs, stop a 12.
# Snapshots 7-12 : pic probable plus tot que v17 (6 slots, plus de pas/epoch).
#   python -X utf8 -m src.train.build_oof_labels --restore-acl --out data/labels/labels_llm_gpt56sol_oofmask_v20b.csv
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_v20b_crop130_oofmask_full.yaml

run_name: v20b_crop130_oofmask_full
model: kneenet_v20b
n_series: 6
backbone: resnet50
pretrained: true
backbone_weights: weights/ResNet50.pt
lstm_hidden: 256

labels_csv: data/labels/labels_llm_gpt56sol_oofmask_v20b.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 1.0
val_frac: 0
include_gold: true
gold_sample_weight: 4.0

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 12
cosine_epochs: 20
save_epochs: [7, 8, 9, 10, 11, 12]
early_stop_patience: 0
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
