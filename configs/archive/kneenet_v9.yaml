# v9 full train (apres le subset si le T1 gagne).
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_v9.yaml

run_name: baseline_v9_t1
model: kneenet_v9
n_series: 4
backbone: convnext_tiny
pretrained: true

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/volumes.zip

train_frac: 1.0

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 20
early_stop_patience: 3

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
