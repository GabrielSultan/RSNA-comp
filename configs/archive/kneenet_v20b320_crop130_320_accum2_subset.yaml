# v20b320 a regime d'optim egal a v20b det 224 : batch 2 x accum 2 = effectif 4,
# 231 pas d'optim par epoch (comme batch 4 a 224). BN gelee -> meme gradient.
# Le parent subset_v20b320_crop130_320_frac025 (batch 2 sans accum) faisait 462 pas/epoch.
# num_workers 2 : RAM (volumes 320 ~2x plus lourds). Sans effet sur les tirages (rng par UID).
# Juger vs subset_v20b_crop130_det_frac025 (val ET gold, Δ > 0.01).
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_v20b320_crop130_320_accum2_subset.yaml

run_name: subset_v20b320_crop130_320_accum2_frac025
model: kneenet_v20b320
n_series: 6
backbone: resnet50
pretrained: true
backbone_weights: weights/ResNet50.pt
lstm_hidden: 256

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130_320
img_size: 320

train_frac: 0.25
train_frac_seed: 42
seed: 42

batch_size: 2
accum_steps: 2
encode_chunk: 4
num_workers: 2
epochs: 10
early_stop_patience: 3
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
