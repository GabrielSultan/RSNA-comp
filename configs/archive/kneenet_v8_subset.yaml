# Comparaison rapide : v8 sur 25 % du train, val pleine, meme seed que v9.
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_v8_subset.yaml

run_name: subset_v8_frac025
model: kneenet_v8
n_series: 3
backbone: convnext_tiny
pretrained: true

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/volumes.zip

train_frac: 0.25
train_frac_seed: 42

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 10
early_stop_patience: 3
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
