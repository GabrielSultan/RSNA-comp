# KneeNet-ViT-h subset : e + CLS/registers dans le pool (gate init 0).
# Baseline ViT = e (val 0.807 / gold 0.814 @ ep7). Pas une tete CLS (c/d).
# Recette e : freeze 1, 3e-5, re-warmup 1. Juger vs e, Δ > 0.01. Pas de --resume.
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_vit_h_crop130_subset.yaml

run_name: subset_vit_dinov3_h_crop130_frac025
model: kneenet_vit_h
n_series: 6
backbone: vit_base_patch16_dinov3.lvd1689m
pretrained: true
backbone_weights: weights/dinov3-vitb16-lvd1689m
lstm_hidden: 256

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 0.25
train_frac_seed: 42

batch_size: 2
encode_chunk: 4
num_workers: 2
epochs: 10
early_stop_patience: 3
skip_gold: false
freeze_encoder_epochs: 1
unfreeze_rewarm_frac: 1.0

lr_backbone: 0.00003
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
