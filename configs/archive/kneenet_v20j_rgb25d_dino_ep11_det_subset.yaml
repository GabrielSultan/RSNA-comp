# v20j = v20h (tete par cible) + voisins DICOM vrais (crop130_rgb25d).
# Meme recette que kneenet_v20h_crop130_dino_ep11_subset.yaml :
# encodeur DINO ep11, gpt56sol, frac 0.25, seed 42.
# Seul levier : zip RGB 2.5D au lieu du gris linspace crop130.
# stem_mix init G -> epoch 0 = centre seul = le v20h DINO.
# Parent : subset_v20h_crop130_dino_ep11_frac025 (val 0.8538 / gold 0.8887 @ ep9).
# Juger val ET gold, delta > 0.01. Lire stem_mix_from_* et head_out_* .
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_v20j_rgb25d_dino_ep11_det_subset.yaml

run_name: subset_v20j_rgb25d_dino_ep11_det_frac025
model: kneenet_v20j
n_series: 6
backbone: resnet50
pretrained: true
backbone_weights: checkpoints/v20h_ssl_dino_screen/encoder_ep11.pt
lstm_hidden: 256
rgb_neighbors: true

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130_rgb25d

train_frac: 0.25
train_frac_seed: 42
seed: 42

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 10
early_stop_patience: 3
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
