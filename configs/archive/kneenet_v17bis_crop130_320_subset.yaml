# v17bis = v17 (CAM dilated + BiLSTM) sur NPZ crop 130 mm **320x320**.
# Grille CAM 20x20 (stride 16). Subset 0.25, meme seed 42 que v17 224.
# batch 2 + encode_chunk 4 : ~meme VRAM que v17 batch 4 a 224.
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_v17bis_crop130_320_subset.yaml

run_name: subset_v17bis_crop130_320_frac025
model: kneenet_v17bis
n_series: 3
backbone: resnet50
pretrained: true
backbone_weights: weights/ResNet50.pt
lstm_hidden: 256

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130_320
img_size: 320

train_frac: 0.25
train_frac_seed: 42

batch_size: 2
encode_chunk: 4
num_workers: 3
epochs: 10
early_stop_patience: 3
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
