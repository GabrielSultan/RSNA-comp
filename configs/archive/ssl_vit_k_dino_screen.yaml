# DINO in-domain pour l'encodeur ViT-k (ViT-B/16 DINOv3, LLRD 0.8 au finetuning).
# Meme recette de vues que v20h : 2 globales 40-100 % (eleve + professeur),
# 6 locales 10-40 % (eleve seul), 4096 categories, pas de flip horizontal.
# Init : weights/dinov3-vitb16-lvd1689m. La tete est jetee.
# Sortie : checkpoints/vit_k_ssl_dino_screen/encoder.pt
# chargeable par backbone_weights (fichier .pt, cles backbone.*).
#
# Optim AdamW lr 5e-4 : lr DINO officielle pour 64 images / step.
# Le SGD 0.004 du ResNet v20h n'est pas repris : il ecrase un ViT deja appris.
# Entree = coupe crop130 en R=G=B, puis la normalisation ImageNet de ViT-e.
# LayerScale (gamma) gele, comme au finetuning ViT-k.
#
# ~ ordre de grandeur du screen v20h (15 min/epoch) ; la 1re ligne de log fige.
# OOM sur 96 Go -> series_batch: 4. Pod 32 vCPU : num_workers: 16.
# Loss uniforme = ln(4096) ~ 8.32. Collee a 8 ou tombee a 0 : collapse.
# encoder.pt est reecrit a chaque epoch.
#
# Sur le pod, timm doit connaitre vit_base_patch16_dinov3 :
#   python3 -m pip install --break-system-packages timm pandas pyyaml scikit-learn
# Envoyer aussi weights/dinov3-vitb16-lvd1689m (le crop130 est deja la recette v20h).
#
#   python -X utf8 -m src.train.ssl_dino --config configs/archive/ssl_vit_k_dino_screen.yaml
# Reprise :
#   python -X utf8 -m src.train.ssl_dino --config configs/archive/ssl_vit_k_dino_screen.yaml --resume

run_name: vit_k_ssl_dino_screen
out_dir: checkpoints/vit_k_ssl_dino_screen
encoder: vit_dinov3
init_weights: weights/dinov3-vitb16-lvd1689m
imagenet_norm: true
optim: adamw

series_csv: data/csv/train_series.csv
zip_path: data/crop130
img_size: 224

epochs: 20
warmup_epochs: 2
series_batch: 8
slices_per_series: 8
num_workers: 8
seed: 42
log_every: 50
forward_chunk: 32

global_crops_scale: [0.4, 1.0]
local_crops_scale: [0.1, 0.4]
local_crops_number: 6
max_rotate_deg: 12
brightness: 0.4
contrast: 0.4
gamma_range: [0.8, 1.2]

out_dim: 4096
hidden_dim: 2048
bottleneck_dim: 256
use_bn_in_head: true
norm_last_layer: true
freeze_last_layer: 1

lr: 0.0005
min_lr: 0.000001
weight_decay: 0.04
clip_grad: 3.0
momentum_teacher: 0.996
teacher_temp: 0.04
warmup_teacher_temp: 0.04
warmup_teacher_temp_epochs: 0
student_temp: 0.1
center_momentum: 0.9
