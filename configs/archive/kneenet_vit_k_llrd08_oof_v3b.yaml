# ViT-k LLRD 0.8 baseline (DINOv3 brut, pas l'encodeur SSL DINO).
# OOF 3 folds : predictions seulement. Le seuil de filtrage viendra apres.
# Meme squelette que kneenet_v20h_crop130_dino_ep11_oof_v3b.yaml.
# Hyps du subset det : llrd 0.8, no_decay, freeze 1 epoch, re-warmup 1,
# batch 2, canal G de crop130_rgb25d. Ici 3 epochs par fold (pas 10 / 14),
# early stop coupe : les 3 epochs tournent, le dump OOF prend best.pt.
# Gold absents de targets_v3b : exclus du train/val.
# Meme decoupage : data/labels/folds3_gpt56sol.csv.
# Pas de laterality.
# Concat -> data/labels/oof_preds_vit_k_llrd08_v3b.csv
#
# Enchainement des 3 folds (reprend last.pt si un fold est coupe) :
#   python -X utf8 -m src.train.run_oof_folds --config configs/archive/kneenet_vit_k_llrd08_oof_v3b.yaml
# un fold seul :
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_vit_k_llrd08_oof_v3b.yaml --fold 0

run_name: vit_k_llrd08_oof_v3b
model: kneenet_vit_e
n_series: 6
backbone: vit_base_patch16_dinov3.lvd1689m
pretrained: true
backbone_weights: weights/dinov3-vitb16-lvd1689m
lstm_hidden: 256

llrd: 0.8
no_decay: true

labels_csv: data/labels/coolin/targets_v3b.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130_rgb25d
rgb_neighbors: true
rgb_as_gray: true

train_frac: 1.0
n_folds: 3
fold_seed: 42
folds_csv: data/labels/folds3_gpt56sol.csv
oof_preds_csv: data/labels/oof_preds_vit_k_llrd08_v3b.csv
dump_oof: true
seed: 42

batch_size: 2
encode_chunk: 4
num_workers: 2
epochs: 3
early_stop_patience: 0
skip_gold: false
freeze_encoder_epochs: 1
unfreeze_rewarm_frac: 1.0

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
