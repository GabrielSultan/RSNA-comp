# CoAt-c = CoAt-a (LLRD 0.8) + un seul levier : distillation v20b det
# sur les 6 cibles ou CoAt-a restait > 0.03 sous v20b a l'ep 6
# (ACL -0.050, MCL -0.088, MM -0.128, PF OA -0.038, Baker -0.111,
# Fracture -0.047). Effusion (+0.044), Synovitis, OA med/lat, LM,
# Contusion restent en labels LLM seuls : le profil specialiste reste.
# Pourquoi : l'ecart CoAt / v20b est la connaissance genou de l'encodeur
# (RadImageNet supervise, IRM MSK), pas le graphe ni la BN gelee
# (decalage BN mesure du meme ordre : ResNet 0.39 sd / x2.1, CoAt
# 0.17 sd / x2.7). LLRD 0.9 (coat_b) n'a pas aide a l'ep3.
# Teacher : subset_v20b_crop130_det_frac025 best.pt (ep10), memes 924
# etudes train, jamais vu la val 653 -> pas de fuite vers la val.
# Loss = BCE LLM (12) + λ T² BCE(z_s/T, σ(z_t/T)) (6 cibles).
# T=2 : logits in-sample surconfiants, le gradient pese les cas moyens.
# Export teacher (deja fait -> data/labels/teacher_v20b_det_subset.csv) :
#   python -X utf8 -m src.train.dump_teacher_preds --config configs/archive/kneenet_v20b_crop130_det_subset.yaml --ckpt checkpoints/subset_v20b_crop130_det_frac025/best.pt --splits train --out data/labels/teacher_v20b_det_subset.csv
# Juger vs subset_coat_a_llrd08_det_frac025 a epoch egale (arrete ep6 :
# 0.7913 / 0.7894), Δ > 0.01 val ET gold, puis vs v20b det (0.8364 / 0.8842).
# Lire aussi les 6 cibles non distillees : elles ne doivent pas baisser.
# Un seul train a la fois sur la 3070 :
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_coat_c_kd_v20b_det_subset.yaml

run_name: subset_coat_c_kd_v20b_det_frac025
model: kneenet_coat_a
n_series: 6
backbone: coatnet_0_rw_224.sw_in1k
pretrained: true
backbone_weights: weights/coatnet_0_rw_224-sw_in1k
lstm_hidden: 256

llrd: 0.8
no_decay: true

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

distil_csv: data/labels/teacher_v20b_det_subset.csv
distil_targets: ["ACL", "MCL", "Medial Meniscus", "PF OA", "Baker's", "Fracture"]
distil_lambda: 0.5
distil_temp: 2.0

train_frac: 0.25
train_frac_seed: 42
seed: 42

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 12
early_stop_patience: 4
skip_gold: false
freeze_encoder_epochs: 1
unfreeze_rewarm_frac: 1.0

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
