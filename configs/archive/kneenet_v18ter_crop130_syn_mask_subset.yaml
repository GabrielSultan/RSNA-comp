# v18ter subset avec synovite silencieuse masquee (NaN hors loss).
# Meme recette que subset_v18ter_crop130_t1_frac025 : crop130 + zips T1,
# frac 0.25, seed 42. Ne pas ecraser ce run gpt56sol.
# Labels : data/labels/labels_llm_gpt56sol_syn_mask_silent.csv
#   mot « synovite » -> GPT-sol ; silence + epanchement -> 0.60 ;
#   silence sans epanchement -> NaN.
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_v18ter_crop130_syn_mask_subset.yaml

run_name: subset_v18ter_crop130_t1_syn_mask_frac025
model: kneenet_v18ter
n_series: 4
backbone: resnet50
pretrained: true
backbone_weights: weights/ResNet50.pt
lstm_hidden: 256
t1_gate_init: -2.2
t1_drop_p: 0.0

labels_csv: data/labels/labels_llm_gpt56sol_syn_mask_silent.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 0.25
train_frac_seed: 42

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 10
early_stop_patience: 3
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
