# KneeNet-ViT-f subset : CAM block 8 (stop-grad) + GAP/LSTM last, stem e.
# 1er run collapse ep3 (val 0.706 -> 0.604, gold 0.56) des que le re-warmup
# finit et 3e-5 plein frappe : double backprop CAM-mid + GAP-last.
# Fix : CAM detach, residu LSTM seulement sur le routage slice, lr 1e-5.
# Archive : checkpoints/subset_vit_dinov3_f_fail_dual_lr3e5/
# Juger vs e (val, gold, ménisque / Baker / MCL, Δ > 0.01). Pas de --resume.
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_vit_f_crop130_subset.yaml

run_name: subset_vit_dinov3_f_crop130_frac025
model: kneenet_vit_f
n_series: 6
backbone: vit_base_patch16_dinov3.lvd1689m
pretrained: true
backbone_weights: weights/dinov3-vitb16-lvd1689m
lstm_hidden: 256
cam_block: 7

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 0.25
train_frac_seed: 42

batch_size: 2
encode_chunk: 4
num_workers: 2
epochs: 10
early_stop_patience: 3
skip_gold: false
freeze_encoder_epochs: 1
unfreeze_rewarm_frac: 1.0

lr_backbone: 0.00001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
