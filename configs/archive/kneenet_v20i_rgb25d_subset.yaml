# v20i = v20b + D : voisins DICOM vrais (crop130_rgb25d proto, 6 slots).
# Entree (D, 3, 224, 224) R=k-1 G=k B=k+1 dans le volume original.
# A+B sur ces canaux, stem_mix init G -> epoch 0 = centre = v20b.
# Recette subset = v20b : gpt56sol, frac 0.25, seed 42.
# Juger vs subset_v20b_crop130_frac025 (val ET gold, Δ > 0.01), surtout
# Contusion / Fracture / menisques. Lire stem_mix_from_* dans history.json.
# Si OOM : batch_size 2 (encode_chunk 8).
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_v20i_rgb25d_subset.yaml

run_name: subset_v20i_rgb25d_frac025
model: kneenet_v20i
n_series: 6
backbone: resnet50
pretrained: true
backbone_weights: weights/ResNet50.pt
lstm_hidden: 256
rgb_neighbors: true

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130_rgb25d

train_frac: 0.25
train_frac_seed: 42

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 10
early_stop_patience: 3
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
