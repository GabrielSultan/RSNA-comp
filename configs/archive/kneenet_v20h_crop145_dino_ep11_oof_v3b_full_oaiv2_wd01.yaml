# Full v20h DINO ep11, recette oaiv2_wd01, FOV RSNA fluide 145 mm.
# Gold in-sample x4, 2399 OAI des l'epoch 0 (poids x0.5), pas de val.
# Regularisation subset wd01 : weight_decay 0.01, dropout 0.2.
# Schedule du full (pas du subset) : LR 1e-4 / 3e-4, cosine sur 20.
# Stop a 8 (au lieu de 7), snapshots 5 a 8.
# zip_path : crop145 d'abord (FS RSNA), crop130 complete T1 RSNA + OAI.
# 3070 8 Go : encode_chunk 8, 3 workers.
#
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_v20h_crop145_dino_ep11_oof_v3b_full_oaiv2_wd01.yaml

run_name: v20h_crop145_dino_ep11_oof_v3b_full_oaiv2_wd01
model: kneenet_v20h
n_series: 6
backbone: resnet50
pretrained: true
backbone_weights: checkpoints/v20h_ssl_dino_screen/encoder_ep11.pt
lstm_hidden: 256

labels_csv: data/oai/derived/targets_v3b_oofmask_oai.csv
series_csv: data/oai/derived/train_series_oai.csv
zip_path:
  - data/crop145
  - data/crop130
oai_sample_weight: 0.5

train_frac: 1.0
val_frac: 0
include_gold: true
gold_sample_weight: 4.0
seed: 42

batch_size: 4
encode_chunk: 8
log_every: 100
num_workers: 3
epochs: 8
cosine_epochs: 20
save_epochs: [5, 6, 7, 8]
early_stop_patience: 0
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.01
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.2
