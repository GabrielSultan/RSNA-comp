# v17 retrain 100 % : labels OOF-masques + 58 gold dans le train.
# Cosine complet sur 20 epochs (meme calendrier que v17_crop130v1).
# Snapshots ep10/12/14/17/20 pour 5 sondages LB (ep12 = ancre du 0.934).
# Gold x4 dans la loss (~5 % de la masse, 58 etudes).
#   python -X utf8 -m src.train.build_oof_labels
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_v17_crop130_oofmask_full.yaml

run_name: v17_crop130_oofmask_full
model: kneenet_v17
n_series: 3
backbone: resnet50
pretrained: true
backbone_weights: weights/ResNet50.pt
lstm_hidden: 256

labels_csv: data/labels/labels_llm_gpt56sol_oofmask.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 1.0
val_frac: 0
include_gold: true
gold_sample_weight: 4.0

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 20
cosine_epochs: 20
save_epochs: [10, 12, 14, 17, 20]
early_stop_patience: 0
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4