# Ablation ViT-S : meme recette que kneenet_vit_k_llrd_det_subset.yaml
# (ViT-k 224, LLRD 0.8), backbone ViT-S/16.
# Pas le 320 (kneenet_vit_k320) et pas hybrid025.
# Labels et split = checkpoints/subset_vit_k_llrd08_det_frac025 :
#   labels_llm_gpt56sol.csv, train_frac 0.25, train_frac_seed 42.
#   924 UID train identiques, val 653. La reference lisait le canal G de
#   crop130_rgb25d ; ces zips ne sont plus la. crop130 grayscale est ce canal.
#   python -X utf8 -m src.train.train --config configs/archive/kneenet_vit_k_s_llrd08_det_subset.yaml

run_name: subset_vit_k_s_llrd08_det_frac025
model: kneenet_vit_e
n_series: 6
backbone: vit_small_patch16_dinov3.lvd1689m
pretrained: true
backbone_weights: weights/dinov3-vits16-lvd1689m
lstm_hidden: 256

llrd: 0.8
no_decay: true

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 0.25
train_frac_seed: 42
seed: 42

batch_size: 2
# RTX 3070 8 Go, 16 Go RAM. Pas le pod (encode_chunk 288, grad_checkpoint
# false, 8 workers) : ca sature la RAM. Plafond local du ViT-B 224 = chunk 4.
# ViT-S est deux fois plus etroit, donc chunk 16 (le ViT-B local s'arrete a 4).
encode_chunk: 16
grad_checkpoint: true
num_workers: 2
log_every: 50
epochs: 14
early_stop_patience: 5
save_epochs: [7, 8, 9, 10]
skip_gold: false
freeze_encoder_epochs: 1
unfreeze_rewarm_frac: 1.0

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
