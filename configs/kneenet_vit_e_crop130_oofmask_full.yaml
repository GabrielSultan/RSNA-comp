# ViT-e retrain 100 % : masque OOF v17 (ACL gpt56sol restauree, recette v20b).
# Gold x4, pas de val. Cosine sur 20 epochs, stop a 12.
# Snapshots chaque epoch a partir de 5 (gold pic ~ep5 sur vit_e_crop130v1).
# Hyps ViT-e : freeze 1, lr_backbone 3e-5, re-warmup 1 epoch, batch 2.
#   python -X utf8 -m src.train.train --config configs/kneenet_vit_e_crop130_oofmask_full.yaml

run_name: vit_e_crop130_oofmask_full
model: kneenet_vit_e
n_series: 6
backbone: vit_base_patch16_dinov3.lvd1689m
pretrained: true
backbone_weights: weights/dinov3-vitb16-lvd1689m
lstm_hidden: 256

labels_csv: data/labels/labels_llm_gpt56sol_oofmask_v20b.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 1.0
val_frac: 0
include_gold: true
gold_sample_weight: 4.0

batch_size: 2
encode_chunk: 4
num_workers: 3
epochs: 12
cosine_epochs: 20
save_epochs: [5, 6, 7, 8, 9, 10, 11, 12]
early_stop_patience: 0
skip_gold: false
freeze_encoder_epochs: 1
unfreeze_rewarm_frac: 1.0

lr_backbone: 0.00003
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
