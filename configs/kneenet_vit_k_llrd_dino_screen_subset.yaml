# Subset ViT-k LLRD 0.8 sur l'encodeur DINO (screen 20 epochs).
# Copier d'abord le snapshot voulu vers backbone_weights
# (encoder_ep5.pt, ep10, ep15 ou ep20).
# Juger vs subset_vit_k_llrd08_frac025 (val ET gold, delta > 0.01).
#
#   python -X utf8 -m src.train.train --config configs/kneenet_vit_k_llrd_dino_screen_subset.yaml

run_name: subset_vit_k_llrd08_dino_frac025
model: kneenet_vit_e
n_series: 6
backbone: vit_base_patch16_dinov3.lvd1689m
pretrained: true
backbone_weights: checkpoints/vit_k_ssl_dino_screen/encoder.pt
lstm_hidden: 256

llrd: 0.8
no_decay: true

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130_rgb25d
rgb_neighbors: true
rgb_as_gray: true

train_frac: 0.25
train_frac_seed: 42
seed: 42

batch_size: 2
encode_chunk: 4
num_workers: 2
epochs: 14
early_stop_patience: 5
skip_gold: false
freeze_encoder_epochs: 1
unfreeze_rewarm_frac: 1.0

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
