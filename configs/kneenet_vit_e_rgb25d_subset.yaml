# ViT-e + D subset : graphe e, voisins DICOM vrais (crop130_rgb25d proto).
# Pas de restack linspace (ViT-e) ni A+B (v20i). stem_mix init G.
# Recette = ViT-e subset : gpt56sol, frac 0.25, seed 42, freeze 1,
# lr_backbone 3e-5, re-warmup 1 epoch, batch 2 (ablation propre vs e).
# Juger vs subset_vit_dinov3_e_crop130_frac025 (val ET gold, Δ > 0.01),
# surtout Contusion / Fracture / menisques. Lire stem_mix_from_* .
# RunPod RTX 4090 24 Go : batch 2 tient ; OOM -> encode_chunk 2.
#   python -X utf8 -m src.train.train --config configs/kneenet_vit_e_rgb25d_subset.yaml

run_name: subset_vit_e_rgb25d_frac025
model: kneenet_vit_e_d
n_series: 6
backbone: vit_base_patch16_dinov3.lvd1689m
pretrained: true
backbone_weights: weights/dinov3-vitb16-lvd1689m
lstm_hidden: 256
rgb_neighbors: true

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130_rgb25d

train_frac: 0.25
train_frac_seed: 42

batch_size: 2
encode_chunk: 4
num_workers: 2
epochs: 10
early_stop_patience: 3
skip_gold: false
freeze_encoder_epochs: 1
unfreeze_rewarm_frac: 1.0

lr_backbone: 0.00003
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
