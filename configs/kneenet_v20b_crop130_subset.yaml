# v20b = v17 (CAM 14x14 + BiLSTM) avec 6 slots protocole :
#   SAG_FS, COR_FS, AX_FS, SAG_T1, COR_T1, AX_T1
# Pas de repli fluide->T1. AX_T1 remplace le slot vide "fluide sans FS".
# Zips proto (COR/AX T1) deja dans data/crop130/.
# Meme recette subset que v17 : gpt56sol, frac 0.25, seed 42.
# Juger vs subset_v17_crop130_frac025 (val ET gold, Δ > 0.01).
# 6x24 tokens : si OOM, baisser batch_size a 2 (garder encode_chunk 8).
#   python -X utf8 -m src.train.train --config configs/kneenet_v20b_crop130_subset.yaml

run_name: subset_v20b_crop130_frac025
model: kneenet_v20b
n_series: 6
backbone: resnet50
pretrained: true
backbone_weights: weights/ResNet50.pt
lstm_hidden: 256

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 0.25
train_frac_seed: 42

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 10
early_stop_patience: 3
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
