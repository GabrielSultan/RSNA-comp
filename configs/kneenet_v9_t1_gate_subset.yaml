# v9 + gate T1 (init ≈ 0) + encodeur T1 detache (no_grad / BN figee).
# Meme split que v8 / v9 naif : train_frac_seed 42, 25 % du train, val pleine.
# Ne PAS --resume subset_v9_t1_frac025 : state_dict incompatible (t1_gate_logit).
#   python -X utf8 -m src.train.train --config configs/kneenet_v9_t1_gate_subset.yaml

run_name: subset_v9_t1_gate_frac025
model: kneenet_v9
n_series: 4
backbone: convnext_tiny
pretrained: true

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/volumes.zip

train_frac: 0.25
train_frac_seed: 42

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 10
early_stop_patience: 3
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4

# gate : sigmoid(-4) ≈ 0.018 → le softmax ignore le T1 au depart
t1_gate_init: -4.0
# ConvNeXt n'apprend pas sur les 24 slices T1 (pas de grad, pas de BN)
freeze_t1_encoder: true
# 0 = pas de dropout extra (le dataset a deja series_drop_p=0.15)
t1_drop_p: 0.0
