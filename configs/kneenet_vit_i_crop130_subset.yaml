# KneeNet-ViT-i subset : graphe e + Radio DINO-B/16 (RadImageNet).
# Un levier vs e : backbone radio (meme corpus que v20b) a la place de DINOv3.
# Juger vs e ET v20b (val, gold, menisque / Baker / MCL, Δ > 0.01). Pas de --resume.
#   python -X utf8 -m src.train.train --config configs/kneenet_vit_i_crop130_subset.yaml

run_name: subset_vit_radiodino_b16_crop130_frac025
model: kneenet_vit_i
n_series: 6
backbone: vit_base_patch16_224
pretrained: true
backbone_weights: weights/radio-dino-b16
lstm_hidden: 256

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 0.25
train_frac_seed: 42

batch_size: 2
encode_chunk: 4
num_workers: 2
epochs: 10
early_stop_patience: 3
skip_gold: false
freeze_encoder_epochs: 1
unfreeze_rewarm_frac: 1.0

lr_backbone: 0.00003
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4
