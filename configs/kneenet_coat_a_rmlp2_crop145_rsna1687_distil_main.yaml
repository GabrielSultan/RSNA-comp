# CoAt-a, encodeur du CoAtNet public (Raptor), pas ses poids SWA.
# Public 0.956 : coatnet_rmlp_2_rw_384.sw_in12k_ft_in1k, SWA
# raptor_ft_alldata_t16_blendjev_oai_d96_r384_swa.pt, crop 140 mm,
# 96 coupes (26/22/18/12/18) sur 2-98 % de la pile, triplets k-1/k/k+1,
# pool global puis attention par cible. L'inference 0.956 recadre
# 384 -> 320. Le jumeau 224 est un crop centre 0.8 de ce champ.
# Ici : la meme famille timm en 224 (poids IN-12k deja sur disque,
# RelPosMlp, 1024-d, stages 2/6/14/2, 72.9 M). Le graphe CoAt-a
# reste (CAM, BiLSTM, 6 slots, norme 0.5).
# Le run sans gel (lr 5e-5 sur les 24 blocs des le pas 0) est reste
# au hasard : val AUC 0.536 puis 0.511, loss train 0.693. Les features
# IN-12k sont bonnes (std 2.4) et la tete gele apprend (0.69 -> 0.40
# en 12 pas sur un batch fixe). Il faut donc le gel d'une epoch, puis
# un re-warmup complet au degel. LLRD 0.97 : sur 24 blocs le stem reste
# a ~0.5 du pic, pas le 0.8 qui le gele. Pic backbone 1e-4, comme CoAt-0
# qui apprenait. Mesure : meme split et meme teacher que
# subset_v20h_dino_ep11_v3b_rsna1687_distil_main_crop145.
# 3070 8 Go. Banc pire cas (144 coupes valides, bf16, backward) :
#   chunk 8  -> 7.7 s/step, 3.8 Go
#   chunk 16 -> 5.5 s/step, 5.6 Go
#   chunk 24 -> 14.9 s/step, 7.5 Go (la carte sature et ralentit)
#   chunk 32 -> tient a 7.8 Go puis ne finit plus
# encode_chunk 16. batch 2.
#
#   python -X utf8 -m src.train.train --config configs/kneenet_coat_a_rmlp2_crop145_rsna1687_distil_main.yaml

run_name: subset_coat_a_rmlp2_freeze_crop145_rsna1687_distil_main
model: kneenet_coat_a
n_series: 6
backbone: coatnet_rmlp_2_rw_224.sw_in12k_ft_in1k
pretrained: true
backbone_weights: weights/coatnet_rmlp_2_rw_224-sw_in12k_ft_in1k
lstm_hidden: 256
img_size: 224

labels_csv: data/labels/coolin/targets_v3b_rsna1687_distil_main.csv
series_csv: data/oai/derived/train_series_oai.csv
zip_path:
  - data/crop145
  - data/crop130

train_frac: 1.0
val_frac: 0.15
include_gold: false
seed: 42

batch_size: 2
encode_chunk: 16
log_every: 100
num_workers: 4
epochs: 8
cosine_epochs: 10
save_epochs: []
early_stop_patience: 0
skip_gold: false

llrd: 0.97
no_decay: true
freeze_encoder_epochs: 1
unfreeze_rewarm_frac: 1.0

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.01
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.2

distil_csv: data/labels/teacher_original_main_oof_rsna1687.csv
distil_targets: ["ACL", "MCL", "Medial Meniscus", "Lateral Meniscus", "Medial OA", "Lateral OA", "PF OA", "Effusion", "Synovitis", "Baker's", "Contusion", "Fracture"]
distil_lambda: 0.3
distil_temp: 1.0
