# Identique a distil_vite (λ=0.3) sauf λ=0.5. Meme CSV teacher.
# Lancer seulement si lam03 bouge MCL / menisque medial / epanchement
# sans casser la macro (Δ val/gold vs subset_v20b > 0.01 sur les 3).
#   python -X utf8 -m src.train.train --config configs/kneenet_v20b_crop130_subset_distil_vite_lam05.yaml

run_name: subset_v20b_distil_vite_lam05_frac025
model: kneenet_v20b
n_series: 6
backbone: resnet50
pretrained: true
backbone_weights: weights/ResNet50.pt
lstm_hidden: 256

labels_csv: data/labels/labels_llm_gpt56sol.csv
series_csv: data/csv/train_series.csv
zip_path: data/crop130

train_frac: 0.25
train_frac_seed: 42

batch_size: 4
encode_chunk: 8
num_workers: 3
epochs: 10
early_stop_patience: 3
skip_gold: false

lr_backbone: 0.0001
lr_head: 0.0003
weight_decay: 0.05
label_smoothing: 0.0
pos_weight_max: null
head_dim: 512
dropout: 0.4

distil_csv: data/labels/teacher_vite_subset_e.csv
distil_targets: ["MCL", "Medial Meniscus", "Effusion"]
distil_lambda: 0.5
distil_temp: 1.0
